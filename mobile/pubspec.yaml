name: englishbot
description: "Personal English tutor — mobile client."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  cupertino_icons: ^1.0.6
  record: ^7.0.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  flutter_markdown: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# record_linux is broken against current record_platform_interface; we don't
# target Linux desktop for the mobile app (web build covers Linux users).
# Android/iOS/Windows builds aren't affected — they have native impls.

flutter:
  uses-material-design: true
