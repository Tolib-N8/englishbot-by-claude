name: Build release artifacts

# Build APK (Android), EXE (Windows) and AppImage (Linux).
# Push a tag like v0.1.0 to produce a GitHub Release with all three attached.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.0"
  # Set as a repo variable: Settings → Secrets and variables → Variables → BACKEND_URL.
  # When set, all builds bake this URL into the app as the default backend address.
  BACKEND_URL: ${{ vars.BACKEND_URL }}

# Single place to compute the --dart-define block for every build.
# (kept as a workflow-level env so each job can splice it in)

defaults:
  run:
    working-directory: mobile

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Build APK
        run: |
          DEF=""
          if [ -n "$BACKEND_URL" ]; then DEF="--dart-define=BACKEND_URL=$BACKEND_URL"; fi
          flutter build apk --release $DEF
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Build Windows
        shell: pwsh
        run: |
          $def = ""
          if ($env:BACKEND_URL) { $def = "--dart-define=BACKEND_URL=$env:BACKEND_URL" }
          flutter build windows --release $def
      - name: Zip Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath EnglishTutor-windows-x64.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: mobile/EnglishTutor-windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Get appimagetool
        run: |
          curl -L -o /usr/local/bin/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - run: flutter pub get
      - name: Build AppImage
        run: bash scripts/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: mobile/dist/EnglishTutor-x86_64.AppImage

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Build iOS (unsigned)
        run: |
          DEF=""
          if [ -n "$BACKEND_URL" ]; then DEF="--dart-define=BACKEND_URL=$BACKEND_URL"; fi
          flutter build ios --release --no-codesign $DEF
      - name: Package unsigned IPA
        # AltStore re-signs with the user's free Apple ID, so an unsigned IPA is enough.
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../EnglishTutor-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: mobile/EnglishTutor-ios-unsigned.ipa

  release:
    needs: [android, windows, linux, ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-apk/app-release.apk
            artifacts/windows-exe/EnglishTutor-windows-x64.zip
            artifacts/linux-appimage/EnglishTutor-x86_64.AppImage
            artifacts/ios-ipa/EnglishTutor-ios-unsigned.ipa
          generate_release_notes: true
